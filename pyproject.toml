[project]
name = "llm-learning"
version = "0.1.0"
description = "12-week LLM & Agentic AI learning journey"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "jupyter>=1.0",
    "numpy>=1.24",
    "ipython>=8.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
